<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HINODE: Last-Mile Japan</title>
  <meta name="description" content="A small-town Japanese delivery adventure that runs in your browser.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <canvas id="view" tabindex="0"></canvas>

  <div id="boot">
    <div class="boot-card">
      <div class="logo"><span class="jp">日の出</span><span class="en">HINODE</span></div>
      <div class="sub">LAST-MILE JAPAN</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div id="boot-step">Starting</div>
    </div>
  </div>

  <div id="hud" hidden>
    <div id="place"><span class="jp">青島町</span> Aoshima · residential quarter</div>
    <div id="hint">
      <b>Click</b> to look around · <b>WASD</b> move · <b>Shift</b> run · <b>Space</b> jump · <b>E</b> interact · <b>Tab</b> journal · <b>Esc</b> free the mouse
    </div>
    <div id="fps" hidden></div>
  </div>

  <div id="err" hidden>
    <div class="err-card">
      <h2>Something went wrong</h2>
      <p id="err-msg"></p>
      <button id="err-reload" type="button">Reload</button>
    </div>
  </div>

  <noscript><div class="noscript">HINODE needs JavaScript turned on.</div></noscript>
  <script type="module" src="js/main.js?v=13"></script>
</body>
</html>
